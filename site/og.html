<!doctype html>
<!-- Source of the share image og.png (1200 x 630). Not deployed: build.sh skips this file.
     To regenerate: run site/build.sh, copy this file into _site/, serve _site, then
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=site/og.png http://localhost:PORT/og.html
     The sky map uses the projection of the landing page's sky map (home.js, panel 03); every count
     except the quoted number of stars searched is read from the CSV files when the image is rendered. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(760px 520px at 74% 64%, rgba(40, 62, 120, 0.42), transparent 70%), radial-gradient(600px 400px at 0% 0%, rgba(30, 40, 80, 0.30), transparent 70%), linear-gradient(180deg, #070b17 0%, #04060c 70%); }
  #art { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .card { position: absolute; left: 64px; top: 58px; width: 660px; }
  .eye { display: flex; align-items: center; gap: 12px; font: 15px/1 var(--mono); letter-spacing: 0.22em; color: var(--cool); text-transform: uppercase; }
  h1 { font: 500 58px/1.07 var(--serif); color: var(--ink); margin: 20px 0 22px; letter-spacing: -0.012em; }
  h1 em { color: var(--amber-hi); }
  .tag { font-size: 14px; padding: 7px 11px; }
  .fun { position: absolute; left: 64px; top: 312px; display: flex; align-items: flex-start; gap: 16px; }
  .fun .v { font: 30px/1 var(--serif); color: var(--ink); white-space: nowrap; }
  .fun .v small { font-size: 0.6em; color: var(--ink2); margin-left: 3px; }
  .fun .l { font: 14.5px/1 var(--mono); letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; margin-top: 10px; white-space: nowrap; }
  .fun .ar { width: 34px; height: 1px; margin-top: 15px; background: linear-gradient(90deg, rgba(142, 197, 230, 0.2), rgba(240, 178, 90, 0.75)); position: relative; }
  .fun .ar::after { content: ""; position: absolute; right: -1px; top: -3.5px; border: 4px solid transparent; border-left: 7px solid rgba(240, 178, 90, 0.85); border-right: 0; }
  .count { position: absolute; left: 60px; top: 392px; display: flex; align-items: center; gap: 18px; }
  .count b { font: 400 112px/0.8 var(--serif); color: var(--amber-hi); letter-spacing: -0.02em; text-shadow: 0 0 30px rgba(240, 178, 90, 0.45); }
  .count span { font: 22px/1.25 var(--serif); color: var(--ink2); }
  .split { position: absolute; left: 64px; top: 500px; font: 14.5px/1 var(--mono); letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
  .site { position: absolute; left: 64px; bottom: 50px; font: 15px/1 var(--mono); letter-spacing: 0.1em; color: var(--dim); }
  .site b { font-weight: 400; color: var(--ink2); }
  .key { position: absolute; right: 64px; top: 60px; text-align: right; }
  .key .h { font: 14px/1 var(--mono); letter-spacing: 0.2em; color: var(--cool); text-transform: uppercase; }
  .legend { display: flex; justify-content: flex-end; gap: 16px; margin-top: 14px; font: 15px/1 var(--mono); letter-spacing: 0.06em; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .tier-dot { width: 13px; height: 13px; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--amber); opacity: 0.8; }
  .frame::before { left: 28px; top: 28px; border-right: 0; border-bottom: 0; }
  .frame::after { right: 28px; bottom: 28px; border-left: 0; border-top: 0; }
</style>
</head>
<body>
<canvas id="art" width="2400" height="1260"></canvas>
<div class="frame"></div>
<div class="card">
  <div class="eye"><svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="7.5" r="5.6" fill="none" stroke="#f0b25a" stroke-width="1.4"/><circle cx="17.4" cy="9" r="1.6" fill="#f4ede1"/><path d="M1 16.5 H10.5 L12.2 18.6 H17.8 L19.5 16.5 H29" fill="none" stroke="#8ec5e6" stroke-width="1.4"/></svg>Independent TESS transit searches</div>
  <h1>Faint transits in light<br><em>TESS had already recorded</em></h1>
  <span class="tag t-cand">Candidates &middot; not confirmed</span>
</div>
<div class="fun">
  <div><div class="v">4.04<small>M</small></div><div class="l">stars searched</div></div><div class="ar"></div>
  <div><div class="v" id="cat">&hellip;</div><div class="l">signals vetted</div></div>
</div>
<div class="count"><b id="n">&hellip;</b><span>counted transit<br>candidates on<br><i id="stars" style="font-style:normal">&hellip;</i> stars</span></div>
<div class="split" id="split"></div>
<div class="site"><b>eumemic.github.io/exoplanets</b> &nbsp;&middot;&nbsp; <span id="date"></span></div>
<div class="key"><div class="h">Every counted candidate &middot; whole sky</div><div class="legend" id="legend"></div></div>
<script src="common.js"></script>
<script>
(function () {
  var X = window.Exo, TAU = Math.PI * 2, D = Math.PI / 180, EPS = 23.4393 * D, W = 1200, H = 630;
  var cv = document.getElementById('art'), c = cv.getContext('2d');
  c.scale(2, 2);
  function rng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // faint dust of background stars
  var r = rng(11);
  for (var i = 0; i < 260; i++) { c.fillStyle = 'rgba(236,232,222,' + (0.08 + 0.3 * r() * r()) + ')'; c.beginPath(); c.arc(r() * W, r() * H, 0.4 + r() * 0.8, 0, TAU); c.fill(); }

  // sky map: Hammer equal-area projection, RA increasing to the left (as home.js, panel 03)
  var geo = { s: 129, cx: 792, cy: 404 };
  function hammer(ra, dec) {
    var l = ((ra + 180) % 360 + 360) % 360 - 180; l = -l * D; var p = dec * D;
    var z = Math.sqrt(1 + Math.cos(p) * Math.cos(l / 2));
    return [2 * Math.SQRT2 * Math.cos(p) * Math.sin(l / 2) / z, Math.SQRT2 * Math.sin(p) / z];
  }
  function proj(ra, dec) { var h = hammer(ra, dec); return [geo.cx + h[0] * geo.s, geo.cy - h[1] * geo.s]; }
  function eclToEq(lam) { var dec = Math.asin(Math.sin(EPS) * Math.sin(lam)); var ra = Math.atan2(Math.cos(EPS) * Math.sin(lam), Math.cos(lam)); return [((ra / D) + 360) % 360, dec / D]; }
  function galToEq(l) {
    var aG = 192.85948 * D, dG = 27.12825 * D, lN = 122.93192 * D;
    var dec = Math.asin(Math.cos(dG) * Math.cos(lN - l));
    var ra = aG + Math.atan2(Math.sin(lN - l), -Math.sin(dG) * Math.cos(lN - l));
    return [((ra / D) % 360 + 360) % 360, dec / D];
  }
  function curve(fn, n) {
    var prev = null; c.beginPath();
    for (var i = 0; i <= n; i++) {
      var e = fn(i / n * TAU), q = proj(e[0], e[1]);
      if (prev && Math.abs(q[0] - prev[0]) > geo.s * 1.2) c.moveTo(q[0], q[1]); else if (prev) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]);
      prev = q;
    }
    c.stroke();
  }
  var A = 2 * Math.SQRT2 * geo.s, B = Math.SQRT2 * geo.s;
  var g = c.createRadialGradient(geo.cx, geo.cy, 0, geo.cx, geo.cy, A);
  g.addColorStop(0, 'rgba(30,44,84,0.6)'); g.addColorStop(1, 'rgba(10,16,32,0.5)');
  c.fillStyle = g; c.beginPath(); c.ellipse(geo.cx, geo.cy, A, B, 0, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.ellipse(geo.cx, geo.cy, A, B, 0, 0, TAU); c.clip();
  c.strokeStyle = 'rgba(164,182,222,0.11)'; c.lineWidth = 1;
  for (var ra = 0; ra < 360; ra += 30) { c.beginPath(); for (var d = -90; d <= 90; d += 3) { var q = proj(ra === 180 ? 179.999 : ra, d); if (d === -90) c.moveTo(q[0], q[1]); else c.lineTo(q[0], q[1]); } c.stroke(); }
  for (d = -60; d <= 60; d += 30) { c.beginPath(); for (ra = -179.999; ra <= 180; ra += 3) { q = proj(ra, d); if (ra === -179.999) c.moveTo(q[0], q[1]); else c.lineTo(q[0], q[1]); } c.stroke(); }
  c.lineWidth = 16; c.strokeStyle = 'rgba(142,197,230,0.05)'; curve(galToEq, 360);
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(142,197,230,0.34)'; curve(galToEq, 360);
  c.setLineDash([5, 5]); c.strokeStyle = 'rgba(240,178,90,0.5)'; curve(eclToEq, 360); c.setLineDash([]);
  c.restore();
  c.font = '13px ' + getComputedStyle(document.body).getPropertyValue('--mono'); c.textAlign = 'left';
  var qe = proj.apply(null, eclToEq(255 * D)), qg = proj.apply(null, galToEq(60 * D));
  c.fillStyle = 'rgba(240,178,90,0.75)'; c.fillText('ecliptic', qe[0] + 4, qe[1] + 18);
  c.fillStyle = 'rgba(142,197,230,0.75)'; c.fillText('Galactic plane', qg[0] + 8, qg[1] + 4);
  c.strokeStyle = 'rgba(164,182,222,0.34)'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(geo.cx, geo.cy, A, B, 0, 0, TAU); c.stroke();

  function marker(tier, x, y, rr) { // as Sky.marker in shell.js
    var st = X.TIER_STYLE[tier]; c.fillStyle = st.color; c.beginPath();
    if (st.shape === 'circle') c.arc(x, y, rr, 0, TAU);
    else if (st.shape === 'square') c.rect(x - rr * 0.88, y - rr * 0.88, rr * 1.76, rr * 1.76);
    else if (st.shape === 'triangle') { c.moveTo(x, y - rr * 1.15); c.lineTo(x + rr * 1.05, y + rr * 0.8); c.lineTo(x - rr * 1.05, y + rr * 0.8); c.closePath(); }
    else { c.moveTo(x, y - rr * 1.2); c.lineTo(x + rr * 1.05, y); c.lineTo(x, y + rr * 1.2); c.lineTo(x - rr * 1.05, y); c.closePath(); }
    c.fill();
  }
  function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  X.loadCandidates().then(function (rows) {
    var counted = rows.filter(function (r) { return X.isCountedTier(r.tier); });
    var stars = new Set(counted.map(function (r) { return r.tic; })).size;
    var cat = rows.filter(function (r) { return r.search === 'full-sky'; }).length;
    var pts = counted.filter(function (r) { return !isNaN(r.ra) && !isNaN(r.dec); });
    var order = { B: 0, N: 1, L1: 2, A: 3 }, counts = {};
    pts.sort(function (a, b) { return order[a.tier] - order[b.tier]; });
    pts.forEach(function (p) { var q = proj(p.ra, p.dec); p._x = q[0]; p._y = q[1]; counts[p.tier] = (counts[p.tier] || 0) + 1; });
    // soft glow, then the markers
    c.globalCompositeOperation = 'lighter';
    pts.forEach(function (p) {
      var col = X.TIER_STYLE[p.tier].color, gg = c.createRadialGradient(p._x, p._y, 0, p._x, p._y, 11);
      gg.addColorStop(0, rgba(col, 0.32)); gg.addColorStop(1, rgba(col, 0));
      c.fillStyle = gg; c.beginPath(); c.arc(p._x, p._y, 11, 0, TAU); c.fill();
    });
    c.globalCompositeOperation = 'source-over';
    pts.forEach(function (p) { marker(p.tier, p._x, p._y, 3.3); });
    var fmt = function (x) { return x.toLocaleString('en-US'); };
    document.getElementById('n').textContent = fmt(counted.length);
    document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    document.getElementById('stars').textContent = fmt(stars);
    document.getElementById('cat').textContent = fmt(cat);
    var full = counted.filter(function (r) { return r.search === 'full-sky'; }).length;
    document.getElementById('split').textContent = fmt(full) + ' full-sky + ' + fmt(counted.length - full) + ' earlier';
    document.getElementById('legend').innerHTML = ['A', 'B', 'N', 'L1'].map(function (t) { return '<span>' + X.tierDot(t) + t + ' ' + (counts[t] || 0) + '</span>'; }).join('');
  });
})();
</script>
</body>
</html>
